<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>API Dev Console</title>
  <style>body{font-family:monospace;max-width:600px;margin:2rem auto;padding:1rem;background:#111;color:#eee}
  input,button{padding:8px;margin:4px 0;width:100%;box-sizing:border-box;background:#222;color:#eee;border:1px solid #444}
  button{cursor:pointer;background:#0a84ff;color:white;font-weight:bold}
  pre{background:#1a1a1a;padding:1rem;border-radius:4px;overflow:auto;min-height:60px;white-space:pre-wrap}</style>
</head>
<body>
  <h2>🔧 API Dev Console</h2>
  <input id="token" placeholder="Authorization Token (default: secret123)" value="secret123">
  <div style="display:flex;gap:8px">
    <button onclick="fetchEndpoint('/ping')">/ping</button>
    <button onclick="fetchEndpoint('/health')">/health</button>
    <button onclick="fetchEndpoint('/metrics')">/metrics</button>
    <button onclick="fetchEndpoint('/stats')">/stats</button>
  </div>
  <pre id="output">Click a button...</pre>

  <script>
    async function fetchEndpoint(path) {
      const token = document.getElementById('token').value;
      const out = document.getElementById('output');
      out.textContent = '⏳ Loading...';
      try {
        const res = await fetch(`http://localhost:8080${path}`, {
          method: 'GET',
          headers: { 'Authorization': token, 'Content-Type': 'application/json' }
        });
        const data = await res.text();
	const traceId = res.headers.get('X-Request-ID') || 'N/A';
        out.textContent = `👉 HTTP ${res.status}\n${data}`;
      } catch (e) {
        out.textContent = `❌ Error: ${e.message}\nCheck if server is running.`;
      }
    }
  </script>
</body>
</html>
